<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올림포스 영어독해 고2 단어 시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--surface:#FFFFFF;--ink:#18202B;--muted:#687384;--line:#D9DEE5;--soft:#F6F8FA;--ok:#0F8A5F;--okbg:#E5F5EE;--no:#C8372D;--nobg:#FBEAE8;--accent:#1F3A5F;
--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1B2129;--ink:#E8ECF1;--muted:#9AA4B2;--line:#2C343F;--soft:#212833;--ok:#3DC48E;--okbg:#16352A;--no:#F07468;--nobg:#3A1E1C;}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1B2129;--ink:#E8ECF1;--muted:#9AA4B2;--line:#2C343F;--soft:#212833;--ok:#3DC48E;--okbg:#16352A;--no:#F07468;--nobg:#3A1E1C;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.screen{display:none}.screen.on{display:block}
/* home */
.mast{padding:18px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:26px}
.mast .book{font-size:14px;color:var(--muted);margin:0 0 6px}
.mast h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,6vw,46px);line-height:1.1;margin:0;letter-spacing:-.01em}
.mast p.lead{margin:12px 0 0;color:var(--muted);max-width:54ch}
.resetrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.ranktable{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface)}
.ranktable th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.ranktable td{padding:10px;border-bottom:1px solid var(--line);word-break:keep-all;vertical-align:top}
.ranktable td.rk{font-family:var(--serif);font-weight:700;font-size:20px;width:2.4em;color:var(--accent)}
.ranktable td.nm{font-weight:700}
.ranktable td.sc{font-weight:700;white-space:nowrap}
.ranktable td.sm{color:var(--muted);font-size:13px}
.ranktable tr.me td{background:var(--okbg)}
.rankcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 2px;overflow-x:auto}
.status{color:var(--muted);padding:18px 10px;margin:0}
.note{font-size:13px;color:var(--muted);margin:12px 2px 0}
.reg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;padding:16px;background:var(--soft);border-radius:10px}
.reg label{font-weight:700}
.reg input{flex:1;min-width:140px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.regmsg{margin:10px 0 0;font-weight:600;min-height:1em}
.regmsg.err{color:var(--no)}.regmsg.ok{color:var(--ok)}
.namebox label{font-weight:600}
.namebox input{flex:1;min-width:180px;max-width:280px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.units{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:540px){.units{grid-template-columns:1fr}}
.unit{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:6px 12px 12px 6px;padding:16px 18px}
.unit:hover{border-color:var(--c)}
.unit .num{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1;color:var(--c);min-width:1.4em;text-align:center}
.unit .t{font-weight:700;font-size:18px}
.unit .s{color:var(--muted);font-size:14px}
.best{display:inline-block;margin-top:4px;font-size:13px;color:var(--c);font-weight:600}
/* setup */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-size:15px;margin-bottom:14px}
.back:hover{color:var(--ink)}
.sethead{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:22px}
.sethead .big{font-family:var(--serif);font-size:64px;font-weight:700;line-height:.9;color:var(--accent)}
.sethead h2{margin:0;font-size:24px}
.sethead p{margin:2px 0 0;color:var(--muted);font-size:14px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-weight:700;margin-bottom:10px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:500}
.seg label small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.seg.modes label{border-radius:10px;flex:1;min-width:150px}
.seg input:checked+label{border-color:var(--accent);background:var(--accent);color:#fff}
.seg input:checked+label small{color:rgba(255,255,255,.82)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px 26px;font-weight:700;font-size:17px}
.primary:hover{filter:brightness(1.08)}
.ghost{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 20px;font-weight:600}
.ghost:hover{border-color:var(--ink)}
details.list{margin-top:26px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
details.list summary{padding:14px 16px;cursor:pointer;font-weight:600}
.wtable{width:100%;border-collapse:collapse;font-size:15px}
.wtable td{padding:7px 16px;border-top:1px solid var(--line);vertical-align:top}
.wtable td.n{color:var(--muted);width:3em;font-variant-numeric:tabular-nums}
.wtable td.e{font-family:var(--serif);font-weight:600;font-size:16px}
.wtable tr.ph td{background:var(--soft);font-weight:700;font-size:13px;color:var(--muted)}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.qtop b{color:var(--ink)}
.quit{background:none;border:0;color:var(--muted);padding:4px 0;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:30px 22px 26px}
.prompt-k{font-size:14px;color:var(--muted);margin:0 0 6px;text-align:center}
.word{text-align:center;margin:0 0 26px;font-size:clamp(30px,7vw,48px);line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.word.en{font-family:var(--serif);font-weight:700}
.word.ko{font-weight:700;font-size:clamp(26px,6vw,38px)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.opt.en span.v{font-family:var(--serif);font-weight:600;font-size:18px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.opt[disabled]{cursor:default}
.typebox{display:flex;gap:10px}
.typebox input{flex:1;min-width:0;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--serif);font-size:20px}
.typebox input.right{border-color:var(--ok);background:var(--okbg)}
.typebox input.wrong{border-color:var(--no);background:var(--nobg)}
.fb{min-height:28px;margin-top:16px;text-align:center}
.fb .r{color:var(--ok);font-weight:700}
.fb .w{color:var(--no);font-weight:700}
.fb .ans{font-family:var(--serif);font-weight:700}
.nextrow{display:flex;justify-content:flex-end;margin-top:6px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
/* result */
.sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:26px 22px}
.rhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:14px}
.rhead h2{margin:0;font-size:20px}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.score{display:flex;align-items:baseline;gap:14px;margin:22px 0 6px;flex-wrap:wrap}
.score .s{font-family:var(--serif);font-weight:700;font-size:76px;line-height:1;color:var(--accent)}
.score .of{font-size:22px;color:var(--muted)}
.score .pct{font-size:18px;font-weight:700;margin-left:auto}
.msg{margin:0 0 20px;color:var(--muted)}
.rtitle{font-weight:700;margin:22px 0 8px}
.rtable{width:100%;border-collapse:collapse;font-size:15px}
.rtable th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1.5px solid var(--line)}
.rtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.e{font-family:var(--serif);font-weight:600}
.rtable td{word-break:keep-all}.rtable td:first-child{white-space:nowrap;color:var(--muted)}
.rtable td.mine{color:var(--no)}
.tablewrap{overflow-x:auto}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.perfect{padding:16px;background:var(--okbg);color:var(--ok);border-radius:10px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="screen on" aria-labelledby="h1">
  <header class="mast">
    <p class="book">올림포스 영어독해 · 고2</p>
    <h1 id="h1">단어 시험</h1>
    <p class="lead">시험 볼 단원을 고르세요. 단원마다 Part 1, Part 2를 따로 보거나 한 번에 볼 수 있어요.</p>
  </header>
  <ul class="units" id="units"></ul>
  <div class="resetrow"><button class="primary" id="rankBtn">순위 보기</button><button class="ghost" id="resetBtn">기록 리셋</button></div>
</section>

<section id="setup" class="screen" aria-labelledby="setTitle">
  <button class="back" data-go="home">← 단원 목록</button>
  <div class="sethead"><span class="big" id="setNum"></span><div><h2 id="setTitle"></h2><p id="setSub"></p></div></div>
  <fieldset><legend>범위</legend><div class="seg" id="partSeg"></div></fieldset>
  <fieldset><legend>문제 유형</legend>
    <div class="seg modes">
      <input type="radio" name="mode" id="m1" value="en2ko" checked><label for="m1">뜻 고르기<small>영어 보고 한글 뜻 4지선다</small></label>
      <input type="radio" name="mode" id="m2" value="ko2en"><label for="m2">단어 고르기<small>한글 뜻 보고 영어 4지선다</small></label>
      <input type="radio" name="mode" id="m3" value="type"><label for="m3">철자 쓰기<small>한글 뜻 보고 영어 직접 입력</small></label>
    </div>
  </fieldset>
  <fieldset><legend>문항 수</legend><div class="seg" id="countSeg"></div></fieldset>
  <button class="primary" id="startBtn">시험 시작</button>
  <details class="list"><summary>시험 전에 단어 목록 보기</summary><table class="wtable" id="wlist"></table></details>
</section>

<section id="quiz" class="screen" aria-live="polite">
  <div class="qtop"><span id="qInfo"></span><span><b id="qNo"></b> <button class="quit" id="quitBtn">그만하기</button></span></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="card">
    <p class="prompt-k" id="qKind"></p>
    <h2 class="word" id="qWord"></h2>
    <div id="qBody"></div>
    <div class="fb" id="fb"></div>
    <div class="nextrow"><button class="primary" id="nextBtn" hidden>다음 문제</button></div>
  </div>
  <p class="hint" id="hint"></p>
</section>

<section id="rank" class="screen" aria-labelledby="rankTitle">
  <button class="back" data-go="home">← 단원 목록</button>
  <header class="mast"><p class="book">올림포스 영어독해 · 고2</p><h1 id="rankTitle">단원별 순위</h1></header>
  <div class="tabs" id="rankTabs" role="tablist"></div>
  <div class="rankcard" id="rankBoard"></div>
  <p class="note" id="rankNote"></p>
</section>

<section id="result" class="screen">
  <div class="sheet" id="sheet">
    <div class="rhead"><div><h2 id="rTitle"></h2><p id="rSub"></p></div><div><p id="rWho" style="text-align:right"></p></div></div>
    <div class="score"><span class="s" id="rScore"></span><span class="of" id="rOf"></span><span class="pct" id="rPct"></span></div>
    <p class="msg" id="rMsg"></p>
    <div class="reg" id="regBox"><label for="rName">이름</label><input id="rName" maxlength="12" autocomplete="off" placeholder="이름을 적고 순위에 올리세요"><button class="primary" id="regBtn">순위에 올리기</button></div>
    <p class="regmsg" id="regMsg"></p>
    <div id="rRank"></div>
    <div id="rWrong"></div>
  </div>
  <div class="actions">
    <button class="primary" id="retryWrong">틀린 단어만 다시 보기</button>
    <button class="ghost" id="retryAll">같은 범위 다시 보기</button>
    <button class="ghost" data-go="home">단원 목록</button>
  </div>
</section>

</div>

function parseUnits(U){return U.map(u=>({n:u.n,title:u.title,color:u.color,parts:u.parts.map((p,pi)=>p.split("\n").map((l,i)=>{const [en,ko]=l.split("|");return {en:en.trim(),ko:ko.trim(),part:pi+1,no:i+1,unit:u.n};}))}));}
function koTokens(ko){return ko.replace(/\([^)]*\)/g,"").replace(/\[[^\]]*\]/g,"").split(/[,;]/).map(s=>s.replace(/[~\s]/g,"")).filter(Boolean);}
function normEn(s){return s.toLowerCase().replace(/~/g," ").replace(/[.,!?'"’]/g,"").replace(/-/g," ").replace(/\s+/g," ").trim();}
function clash(a,b){if(normEn(a.en)===normEn(b.en))return true;const ta=koTokens(a.ko),tb=koTokens(b.ko);return ta.some(t=>tb.includes(t));}
function acceptedAnswers(en){const base=normEn(en);const set=new Set([base]);
 set.add(base.replace(/ do$/,"").replace(/ a into b$/," into").trim());
 if(base.endsWith(" organization"))set.add(base.replace(/ organization$/," org"));
 set.add(base.replace(/\bsomeone\b|\boneself\b/g,"").replace(/\s+/g," ").trim());
 return [...set].filter(Boolean);}
function isCorrectTyped(input,en){const a=normEn(input);if(!a)return false;return acceptedAnswers(en).includes(a);}
function shuffle(arr,rnd=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeOptions(item,unitPool,allPool,rnd=Math.random){
 const picked=[];const seenKey=new Set();
 const tryPool=(pool)=>{for(const c of shuffle(pool,rnd)){if(picked.length>=3)break;if(c===item||clash(c,item))continue;if(picked.some(p=>clash(p,c)))continue;const k=normEn(c.en)+"|"+c.ko;if(seenKey.has(k))continue;seenKey.add(k);picked.push(c);}};
 tryPool(unitPool);if(picked.length<3)tryPool(allPool);
 return shuffle([item,...picked],rnd);}

  $("rankTabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>openRank(+b.dataset.u)));
  $("rankBoard").innerHTML='<p class="status">순위를 불러오는 중이에요.</p>';
  $("rankNote").textContent=Rank.online?"같은 이름은 가장 높은 점수 하나만 보여요. 점수가 같으면 문항 수가 많은 사람, 그다음 빨리 푼 사람이 위로 가요.":"지금은 순위가 이 기기에만 저장돼요.";
  show("rank");
  try{const rows=await Rank.list(n);if(rankUnit===n)$("rankBoard").innerHTML=rankTable(rows);}
  catch(e){$("rankBoard").innerHTML='<p class="status">순위를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.</p>';}
}
$("rankBtn").addEventListener("click",()=>openRank(rankUnit));
$("rName").value=store.get("vt-rname")||"";
$("regBtn").addEventListener("click",async()=>{
  const name=$("rName").value.trim().slice(0,12);
  if(!name){$("regMsg").className="regmsg err";$("regMsg").textContent="이름을 적어 주세요.";$("rName").focus();return;}
  store.set("vt-rname",name);
  const e=st.lastEntry;if(!e)return;e.name=name;
  $("regBtn").disabled=true;$("regMsg").className="regmsg";$("regMsg").textContent="올리는 중이에요.";
  try{await Rank.add(e);$("regBox").hidden=true;$("regMsg").className="regmsg ok";$("regMsg").textContent=`${name} 이름으로 순위에 올렸어요.`;
    try{const rows=await Rank.list(e.unit);$("rRank").innerHTML=`<p class="rtitle">Unit ${e.unit} 순위</p>`+rankTable(rows,name,10);}catch(_){}
  }catch(err){$("regBtn").disabled=false;$("regMsg").className="regmsg err";$("regMsg").textContent="순위에 올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";}
});

function renderHome(){
  document.documentElement.style.setProperty("--accent","#1F3A5F");
  $("units").innerHTML=UNITS_P.map(u=>{
    const total=u.parts[0].length+u.parts[1].length;
    const best=store.get("vt-best-"+u.n);
    return `<li><button class="unit" style="--c:${u.color}" data-u="${u.n}"><span class="num">${u.n}</span><span><span class="t">Unit ${u.n} ${esc(u.title)}</span><br><span class="s">Part 1 ${u.parts[0].length}개, Part 2 ${u.parts[1].length}개, 모두 ${total}개</span>${best?`<br><span class="best">최고 점수 ${esc(best)}</span>`:""}</span></button></li>`;}).join("");
  $("units").querySelectorAll(".unit").forEach(b=>b.addEventListener("click",()=>openSetup(+b.dataset.u)));
}
function openSetup(n){
  const u=UNITS_P.find(x=>x.n===n);st.unit=u;
  document.documentElement.style.setProperty("--accent",u.color);
  $("setNum").textContent=u.n;$("setTitle").textContent=`Unit ${u.n} ${u.title}`;
  $("setSub").textContent=`단어 ${u.parts[0].length+u.parts[1].length}개`;
  const parts=[["all",`전체 (${u.parts[0].length+u.parts[1].length})`],["1",`Part 1 (${u.parts[0].length})`],["2",`Part 2 (${u.parts[1].length})`]];
  $("partSeg").innerHTML=parts.map(([v,l],i)=>`<input type="radio" name="part" id="p${v}" value="${v}" ${i===0?"checked":""}><label for="p${v}">${l}</label>`).join("");
  st.part="all";
  $("partSeg").querySelectorAll("input").forEach(r=>r.addEventListener("change",()=>{st.part=r.value;renderCounts();}));
  renderCounts();
  let rows="";u.parts.forEach((p,pi)=>{rows+=`<tr class="ph"><td colspan="3">Part ${pi+1} (${p.length}개)</td></tr>`+p.map(w=>`<tr><td class="n">${String(w.no).padStart(2,"0")}</td><td class="e">${esc(w.en)}</td><td>${esc(w.ko)}</td></tr>`).join("");});
  $("wlist").innerHTML=rows;$("wlist").closest("details").open=false;
  show("setup");
}
function poolFor(){const u=st.unit;return st.part==="all"?u.parts.flat():u.parts[+st.part-1];}
function renderCounts(){
  const n=poolFor().length;const opts=[["20","20문제"],["30","30문제"],["all",`전부 (${n}문제)`]].filter(([v])=>v==="all"||+v<n);
  if(!opts.some(o=>o[0]===st.count))st.count="all";
  $("countSeg").innerHTML=opts.map(([v,l])=>`<input type="radio" name="cnt" id="c${v}" value="${v}" ${v===st.count?"checked":""}><label for="c${v}">${l}</label>`).join("");
  $("countSeg").querySelectorAll("input").forEach(r=>r.addEventListener("change",()=>st.count=r.value));
}
document.querySelectorAll('input[name="mode"]').forEach(r=>r.addEventListener("change",()=>st.mode=r.value));
$("startBtn").addEventListener("click",()=>{const pool=poolFor();st.lastPool=pool;let items=shuffle(pool);if(st.count!=="all")items=items.slice(0,+st.count);startQuiz(items);});

function startQuiz(items,isRetry){st.items=items;st.i=0;st.results=[];st.isRetry=!!isRetry;st.t0=Date.now();show("quiz");renderQ();}
function renderQ(){
  const it=st.items[st.i],u=st.unit,m=st.mode;st.answered=false;
  $("qInfo").textContent=`Unit ${u.n} ${MODE_NAME[m]}`;
  $("qNo").textContent=`${st.i+1} / ${st.items.length}`;
  $("barFill").style.width=(st.i/st.items.length*100)+"%";
  $("fb").innerHTML="";$("nextBtn").hidden=true;
  const w=$("qWord");
  if(m==="en2ko"){$("qKind").textContent="이 단어의 뜻은?";w.className="word en";w.textContent=it.en;}
  else{$("qKind").textContent=m==="type"?"이 뜻의 영어 단어를 쓰세요":"이 뜻의 영어 단어는?";w.className="word ko";w.textContent=it.ko;}
  if(m==="type"){
    $("qBody").innerHTML=`<div class="typebox"><input id="tIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="영어 단어 입력" placeholder="영어로 입력"><button class="primary" id="tBtn">확인</button></div>`;
    const inp=$("tIn");inp.focus();
    $("tBtn").addEventListener("click",checkTyped);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();e.stopPropagation();if(!st.answered)checkTyped();else next();}});
    $("hint").textContent="답을 쓰고 Enter를 누르면 채점돼요. ~ 표시는 안 써도 돼요.";
  }else{
    const opts=makeOptions(it,u.parts.flat(),ALL);
    $("qBody").innerHTML=`<div class="opts">${opts.map((o,k)=>`<button class="opt ${m==="ko2en"?"en":""}" data-k="${k}"><span class="k">${k+1}</span><span class="v">${esc(m==="en2ko"?o.ko:o.en)}</span></button>`).join("")}</div>`;
    $("qBody").querySelectorAll(".opt").forEach((b,k)=>b.addEventListener("click",()=>choose(k,opts)));
    $("qBody")._opts=opts;
    $("hint").textContent="키보드 숫자 1~4로도 고를 수 있어요.";
  }
}
function choose(k,opts){
  if(st.answered)return;st.answered=true;
  const it=st.items[st.i],picked=opts[k],ok=picked===it;
  const btns=$("qBody").querySelectorAll(".opt");
  btns.forEach((b,j)=>{b.disabled=true;if(opts[j]===it)b.classList.add("right");});
  if(!ok)btns[k].classList.add("wrong");
  const mine=st.mode==="en2ko"?picked.ko:picked.en;
  record(it,ok,mine);
  $("fb").innerHTML=ok?`<span class="r">정답!</span>`:`<span class="w">틀렸어요.</span> 정답: <span class="ans">${esc(st.mode==="en2ko"?it.ko:it.en)}</span>`;
  showNext();
}
function checkTyped(){
  if(st.answered)return;const inp=$("tIn");const val=inp.value.trim();
  if(!val){inp.focus();$("fb").innerHTML=`<span class="w">답을 입력한 뒤 확인을 누르세요.</span>`;return;}
  st.answered=true;const it=st.items[st.i];const ok=isCorrectTyped(val,it.en);
  inp.readOnly=true;inp.classList.add(ok?"right":"wrong");$("tBtn").disabled=true;
  record(it,ok,val);
  $("fb").innerHTML=ok?`<span class="r">정답!</span> <span class="ans">${esc(it.en)}</span>`:`<span class="w">틀렸어요.</span> 정답: <span class="ans">${esc(it.en)}</span>`;
  showNext();
}
function record(it,ok,mine){st.results.push({it,ok,mine});}
function showNext(){const b=$("nextBtn");b.hidden=false;b.textContent=st.i===st.items.length-1?"결과 보기":"다음 문제";if(st.mode!=="type")b.focus();}
function next(){if(!st.answered)return;if(st.i<st.items.length-1){st.i++;renderQ();}else finish();}
$("nextBtn").addEventListener("click",next);
document.addEventListener("keydown",e=>{
  if(!$("quiz").classList.contains("on"))return;
  if(st.mode!=="type"&&!st.answered&&/^[1-4]$/.test(e.key)){const opts=$("qBody")._opts;if(opts)choose(+e.key-1,opts);}
  else if(e.key==="Enter"&&st.answered&&document.activeElement!==$("nextBtn")&&st.mode!=="type"){e.preventDefault();next();}
});
twoStep($("quitBtn"),"그만하기","한 번 더 누르면 종료",()=>{if(st.results.length)finish();else show("setup");});

function finish(){
  $("barFill").style.width="100%";
  const u=st.unit,total=st.results.length,right=st.results.filter(r=>r.ok).length,pct=Math.round(right/total*100);
  const partName=st.part==="all"?"Part 1 + 2":`Part ${st.part}`;
  $("rTitle").textContent=`Unit ${u.n} ${u.title}`;
  $("rSub").textContent=`${partName}, ${MODE_NAME[st.mode]}`;
  const d=new Date();
  $("rWho").innerHTML=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  $("rScore").textContent=right;$("rOf").textContent=`/ ${total}`;$("rPct").textContent=`${pct}점`;
  $("rMsg").textContent=pct===100?"모두 맞혔어요. 완벽해요!":pct>=90?"아주 잘했어요. 틀린 단어만 한 번 더 보면 끝!":pct>=70?"좋아요. 틀린 단어를 다시 연습해 봐요.":"틀린 단어 위주로 다시 연습해 봐요.";
  const wrong=st.results.filter(r=>!r.ok);
  if(!wrong.length)$("rWrong").innerHTML=`<p class="perfect">틀린 단어가 없어요.</p>`;
  else $("rWrong").innerHTML=`<p class="rtitle">틀린 단어 ${wrong.length}개</p><div class="tablewrap"><table class="rtable"><thead><tr><th>Part</th><th>단어</th><th>뜻</th><th>내 답</th></tr></thead><tbody>${wrong.map(r=>`<tr><td>${r.it.part}-${String(r.it.no).padStart(2,"0")}</td><td class="e">${esc(r.it.en)}</td><td>${esc(r.it.ko)}</td><td class="mine">${esc(r.mine)}</td></tr>`).join("")}</tbody></table></div>`;
  $("retryWrong").hidden=!wrong.length;
  if(total===st.lastPool.length||total>=20){const key="vt-best-"+u.n,prev=parseInt(store.get(key)||"0",10);if(pct>prev)store.set(key,pct+"점");}
  const sec=Math.round((Date.now()-st.t0)/1000);
  st.lastEntry=st.isRetry?null:{unit:u.n,right,total,pct,part:st.part,mode:st.mode,sec,at:Date.now()};
  $("rRank").innerHTML="";$("regBtn").disabled=false;
  $("regBox").hidden=st.isRetry;
  $("regMsg").className="regmsg";$("regMsg").textContent=st.isRetry?"틀린 단어만 다시 본 시험은 순위에 올라가지 않아요.":"";
  show("result");
}
$("retryWrong").addEventListener("click",()=>startQuiz(shuffle(st.results.filter(r=>!r.ok).map(r=>r.it)),true));
$("retryAll").addEventListener("click",()=>{let items=shuffle(st.lastPool);if(st.count!=="all")items=items.slice(0,+st.count);startQuiz(items);});
renderHome();
})();
</script>
</body>
</html>
